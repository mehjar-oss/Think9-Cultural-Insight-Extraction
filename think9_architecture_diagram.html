<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Think9 System Architecture Diagram</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap"
    rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/html2canvas@1.4.1/dist/html2canvas.min.js"
    integrity="sha384-ZZ1pncU3bQe8y31yfZdMFdSpttDoPmOZg2wguVK9almUodir1PghgT0eY7Mrty8H"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js"
    integrity="sha384-en/ztfPSRkGfME4KIm05joYXynqzUgbsG5nMrj/xEFAHXkeZfO3yMK8QQ+mP7p1/"
    crossorigin="anonymous"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'JetBrains Mono', monospace;
      background: #FFFFFF;
      min-height: 100vh;
      padding: 1.5rem;
      color: white;
    }

    .container {
      max-width: 1440px;
      margin: 0 auto;
      position: relative;
    }

    .header {
      margin-bottom: 1.25rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .header-left {
      display: flex;
      flex-direction: column;
      gap: 0.25rem;
    }

    .header-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
    }

    .pulse-dot {
      width: 12px;
      height: 12px;
      background: #E32636;
      border-radius: 50%;
      box-shadow: 0 0 12px #E32636;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {

      0%,
      100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: 0.5;
        transform: scale(1.2);
      }
    }

    h1 {
      font-size: 1.4rem;
      font-weight: 700;
      letter-spacing: -0.025em;
      color: #000000;
    }

    .subtitle {
      color: #000000;
      font-size: 0.82rem;
      margin-left: 1.75rem;
    }

    .toolbar {
      position: relative;
    }

    .toolbar-toggle {
      background: rgba(30, 41, 59, 0.7);
      border: 1px solid #000000;
      color: #000000;
      width: 36px;
      height: 36px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 1.1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
    }

    .toolbar-toggle:hover {
      background: #000000;
      color: #000000;
    }

    .toolbar-actions {
      display: none;
      position: absolute;
      right: 0;
      top: 44px;
      background: #FFFFFF;
      border: 1px solid #000000;
      border-radius: 8px;
      padding: 6px;
      gap: 6px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
      z-index: 50;
    }

    .toolbar-actions.show {
      display: flex;
    }

    .toolbar-btn {
      background: rgba(30, 41, 59, 0.8);
      border: 1px solid #000000;
      color: #000000;
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.75rem;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.2s;
    }

    .toolbar-btn:hover {
      background: #E32636;
      border-color: #60a5fa;
      color: #000000;
    }

    .diagram-container {
      background: rgba(15, 23, 42, 0.75);
      border-radius: 1rem;
      border: 1px solid #000000;
      padding: 1.25rem;
      overflow-x: auto;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    svg {
      width: 100%;
      min-width: 1380px;
      display: block;
    }

    .footer {
      margin-top: 1rem;
      text-align: center;
      font-size: 0.75rem;
      color: #000000;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    @media print {
      .toolbar {
        display: none !important;
      }
    }
  </style>
</head>

<body>
  <div className="container" id="report-container">

    <!-- Main SVG System Architecture Diagram -->

  <script>
    function toggleToolbar() {
      const el = document.getElementById('toolbarActions');
      el.classList.toggle('show');
    }

    document.addEventListener('click', function (e) {
      const toolbar = document.querySelector('.toolbar');
      if (toolbar && !toolbar.contains(e.target)) {
        document.getElementById('toolbarActions').classList.remove('show');
      }
    });

    async function getCapturedCanvas() {
      const container = document.getElementById('report-container');
      const actions = document.getElementById('toolbarActions');
      actions.classList.remove('show');

      return await html2canvas(container, {
        scale: 2,
        backgroundColor: '#FFFFFF',
        useCORS: true,
        logging: false
      });
    }

    async function copyAsImage() {
      try {
        const canvas = await getCapturedCanvas();
        canvas.toBlob(async (blob) => {
          await navigator.clipboard.write([
            new ClipboardItem({ 'image/png': blob })
          ]);
          alert('Architecture diagram PNG copied to clipboard!');
        });
      } catch (err) {
        console.error('Copy failed:', err);
        alert('Failed to copy PNG to clipboard.');
      }
    }

    async function downloadPNG() {
      try {
        const canvas = await getCapturedCanvas();
        const link = document.createElement('a');
        link.download = 'think9_system_architecture.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (err) {
        console.error('PNG download failed:', err);
      }
    }

    async function downloadPDF() {
      try {
        const canvas = await getCapturedCanvas();
        const imgData = canvas.toDataURL('image/png');
        const { jsPDF } = window.jspdf;
        const pdf = new jsPDF({
          orientation: 'landscape',
          unit: 'px',
          format: [canvas.width / 2, canvas.height / 2]
        });
        pdf.addImage(imgData, 'PNG', 0, 0, canvas.width / 2, canvas.height / 2);
        pdf.save('think9_system_architecture.pdf');
      } catch (err) {
        console.error('PDF download failed:', err);
      }
    }
  </script>
